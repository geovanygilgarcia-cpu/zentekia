# Publica el Worker en producción cada vez que algo entra a main (merge de un PR).
# Requiere el secreto CLOUDFLARE_API_TOKEN en GitHub → Settings → Secrets and variables → Actions
# (token de Cloudflare con la plantilla «Edit Cloudflare Workers» + permiso D1 Edit, para la cuenta de zentekia.com).
name: Publicar a producción

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nunca dos publicaciones a la vez; la segunda espera a que termine la primera
concurrency:
  group: deploy-produccion
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Compila admin, portal y widget (genera worker/src/assets.ts) y revisa los tipos del Worker
      - run: npm run build:apps
      - run: npm run typecheck
      - name: Publicar en Cloudflare
        run: npx wrangler deploy --config worker/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 2dbaf67c6576975767e67cb4d4f844b0
